<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Котята-пираты: Формы</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; padding: 20px; }
        h1 { color: #e94560; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: #16213e; border-radius: 10px; padding: 15px; text-align: center; }
        .card img { width: 100%; height: 250px; object-fit: contain; border-radius: 5px; background: #0f3460; }
        .card h3 { margin: 10px 0 5px; font-size: 16px; }
        .card p { color: #888; font-size: 12px; }
        .stats { text-align: center; margin: 20px 0; padding: 15px; background: #0f3460; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>🏴‍☠️ Экран: Формы (03_shapes)</h1>
    <div class="stats">
        <p>6 предметов | Pollinations.ai (FLUX) | 768x768 JPEG</p>
    </div>
    <div class="grid">
        <div class="card">
            <img src="03_shapes/porthole.png" alt="Иллюминатор">
            <h3>Иллюминатор</h3>
            <p>Круг | porthole.png</p>
        </div>
        <div class="card">
            <img src="03_shapes/chest.png" alt="Сундук">
            <h3>Сундук</h3>
            <p>Квадрат | chest.png</p>
        </div>
        <div class="card">
            <img src="03_shapes/sail.png" alt="Парус">
            <h3>Парус</h3>
            <p>Треугольник | sail.png</p>
        </div>
        <div class="card">
            <img src="03_shapes/gangway.png" alt="Трап">
            <h3>Трап</h3>
            <p>Прямоугольник | gangway.png</p>
        </div>
        <div class="card">
            <img src="03_shapes/parrot_egg.png" alt="Яйцо">
            <h3>Яйцо попугая</h3>
            <p>Овал | parrot_egg.png</p>
        </div>
        <div class="card">
            <img src="03_shapes/candy.png" alt="Конфета">
            <h3>Конфета</h3>
            <p>Ромб | candy.png</p>
        </div>
    </div>
</body>
</html>
